[project]
name = "py-wiki-crawler"
version = "1.1.0"
description = "A small python programm to crawl wiki pages recursively and fetch all the available data. Utilizes the offizial api of known wiki page providers like fandom."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "pyinstaller>=6.22.3",
    "pyside6>=6.12.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tqdm>=4.70.1",
]

[project.scripts]
py-wiki-crawler = "py_wiki_crawler.cli:main"
py-wiki-crawler-gui = "py_wiki_crawler.gui.app:main"
gui = "py_wiki_crawler.gui.app:main"
main = "py_wiki_crawler.cli:main"
build = "src.build:main"
format = "src.tools:format_code"
lint = "src.tools:lint_code"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_wiki_crawler"]
